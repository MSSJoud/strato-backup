## MintPy config for ASF HyP3 InSAR stack: /mnt/data/aoi_3_bologna

########## 1. Compute
mintpy.compute.cluster    = local
mintpy.compute.numWorker  = 8
mintpy.compute.memory     = auto

########## 2. Input processor
mintpy.load.processor     = hyp3

########## 3. HyP3 interferogram products
mintpy.load.unwFile       = /mnt/data/aoi_3_bologna/*/*_unw_phase_clipped.tif
mintpy.load.corFile       = /mnt/data/aoi_3_bologna/*/*_corr_clipped.tif
mintpy.load.demFile       = /mnt/data/aoi_3_bologna/*/*_dem_clipped.tif
mintpy.load.incAngleFile  = /mnt/data/aoi_3_bologna/*/*_lv_theta_clipped.tif
mintpy.load.azAngleFile   = /mnt/data/aoi_3_bologna/*/*_lv_phi_clipped.tif
mintpy.load.waterMaskFile = /mnt/data/aoi_3_bologna/*/*_water_mask_clipped.tif

########## 4. Network pruning
mintpy.network.maxTempBaseline = 60
mintpy.network.maxPerpBaseline = 100

########## 5. Reference point
mintpy.reference.lalo          = auto

########## 6. Masks and inversion
mintpy.unwrapMask.connCompMinPix = 100
mintpy.unwrapMask.maskFile       = auto
mintpy.tempCohMask.min           = 0.4
mintpy.waterBody.mask            = auto

########## 7. Corrections
mintpy.deramp                   = quadratic
mintpy.solidEarthTides         = yes
mintpy.troposphericDelay.method       = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir   = /mnt/data/aoi_3_bologna_weather

########## 8. Work directory
mintpy.workDir = /mnt/data/aoi_3_bologna/mintpy

########## 9. Exports
mintpy.save.hdfEos5 = yes

########## Notes
## This dataset is an ASF HyP3 GAMMA stack in UTM zone 32N with 80 m spacing.
## One interferogram directory currently appears to be missing DEM/water-mask files:
## S1AA_20240215T052756_20240310T052756_VVP024_INT80_G_ueF_CFB4
