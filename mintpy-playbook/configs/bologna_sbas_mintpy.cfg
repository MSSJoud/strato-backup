# MintPy Configuration for Bologna SBAS Test
# ============================================
# Purpose: Time-series analysis using SBAS (Small Baseline Subset) approach
# Method: Dense network with short temporal/spatial baselines
# Expected: Good coverage in all coherent areas (urban + rural)

########## 1. Load Data
mintpy.load.processor      = isce
mintpy.load.autoPath       = no

# Input paths (organized by prepare_for_mintpy.sh)
mintpy.load.unwFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/interferograms/*/filt_topophase.unw.geo
mintpy.load.corFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/interferograms/*/filt_topophase.unw.geo.cor
mintpy.load.connCompFile   = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/interferograms/*/filt_topophase.unw.conncomp
mintpy.load.demFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/geometry/hgt.rdr
mintpy.load.lookupYFile    = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/geometry/lat.rdr
mintpy.load.lookupXFile    = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/geometry/lon.rdr
mintpy.load.incAngleFile   = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/geometry/los.rdr

########## 2. Network Modification (SBAS-specific)
mintpy.network.coherenceBased  = yes
mintpy.network.keepMinSpanTree = yes        # Maintain connectivity (critical for SBAS)
mintpy.network.minCoherence    = 0.7        # Drop low-coherence pairs
mintpy.network.maskDataset     = coherence
mintpy.network.maxTempBaseline = 48         # Match SBAS pair selection (days)
mintpy.network.maxPerpBaseline = 100        # Match SBAS pair selection (meters)

########## 3. Reference Point (Spatial)
# Auto-select highest coherence pixel (typically urban/bedrock)
mintpy.reference.lalo           = auto
# Or manually specify stable area:
# mintpy.reference.lalo         = 44.494,11.343  # Bologna city center (example)

########## 4. Reference Date (Temporal)
mintpy.reference.date           = auto      # Usually first date
# Or specify specific date:
# mintpy.reference.date         = 20230101

########## 5. Unwrapping Error Correction
mintpy.unwrapError.method          = bridging+phase_closure
mintpy.unwrapError.yx              = auto
mintpy.unwrapError.connCompMinArea = 2.5e6  # min area (m^2) for valid component

########## 6. Tropospheric Delay Correction
mintpy.troposphericDelay.method       = pyaps     # Use atmospheric model
mintpy.troposphericDelay.weatherModel = ERA5      # ERA5 reanalysis data
mintpy.troposphericDelay.weatherDir   = auto      # Auto-download

########## 7. Phase Deramping (Orbital Error Removal)
mintpy.deramp            = linear      # Remove linear ramp (range + azimuth)
mintpy.deramp.maskFile   = maskTempCoh.h5

########## 8. Topographic Residual (DEM Error) Correction
mintpy.topographicResidual            = yes
mintpy.topographicResidual.pixelwiseGeometry = yes
mintpy.topographicResidual.stepFuncDate      = auto

########## 9. Time-Series Inversion
mintpy.timeseriesInv.weightFunc       = var     # Variance-based weighting
mintpy.timeseriesInv.minNormVelocity  = yes     # SBAS-style minimum-norm
mintpy.timeseriesInv.waterMaskFile    = auto

########## 10. Velocity Estimation
mintpy.velocity.excludeDate    = auto           # Auto-exclude outliers
mintpy.velocity.startDate      = auto           # Use full time range
mintpy.velocity.endDate        = auto

########## 11. Post-Processing
# Geocoding
mintpy.geocode              = yes
mintpy.geocode.SNWE         = auto              # Auto from data bounds
mintpy.geocode.latStep      = 0.0001            # ~10m resolution
mintpy.geocode.lonStep      = 0.0001

# Save HDF-EOS5 format
mintpy.save.hdfEos5         = yes
mintpy.save.hdfEos5.update  = no
mintpy.save.hdfEos5.subset  = yes

########## 12. Compute and Processing Settings
mintpy.compute.maxMemory    = 4                 # GB
mintpy.compute.numWorker    = 4                 # Parallel workers (auto=all cores)

########## 13. Plotting
mintpy.plot                 = yes
mintpy.plot.maxMemory       = 2.0               # GB for plotting

########## Method-Specific Notes:
# SBAS approach emphasizes:
# - High redundancy (dense network with triangles)
# - Minimum spanning tree preservation
# - Distributed scatterers (multilooking)
# - Good for broad deformation in vegetated areas
# - Expected output: High pixel density, ~5-10 mm/year precision
