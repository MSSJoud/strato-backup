# MintPy SBAS config template for a Punjab Sentinel-1 stack
# Assumes one ISCE2 topsStack project per orbit/frame/direction.
#
# Suggested project layout:
#   /mnt/data/punjab_2018_2025/<stack_id>/
#     reference/
#     baselines/
#     merged/
#     mintpy_work/sbas/
#
# Example stack_id:
#   desc_pathXXX_frameYYY
#
# This template is intended for a corrected LOS time series spanning
# 2018-01-01 through 2025-12-31.

########## 1. Load Data
mintpy.load.processor           = isce
mintpy.load.autoPath            = yes

# Replace <stack_id> with your actual stack folder name.
mintpy.load.metaFile            = /mnt/data/punjab_2018_2025/<stack_id>/reference/IW*.xml
mintpy.load.baselineDir         = /mnt/data/punjab_2018_2025/<stack_id>/baselines
mintpy.load.unwFile             = /mnt/data/punjab_2018_2025/<stack_id>/merged/interferograms/*/filt_*.unw
mintpy.load.corFile             = /mnt/data/punjab_2018_2025/<stack_id>/merged/interferograms/*/filt_*.cor
mintpy.load.connCompFile        = /mnt/data/punjab_2018_2025/<stack_id>/merged/interferograms/*/filt_*.unw.conncomp
mintpy.load.demFile             = /mnt/data/punjab_2018_2025/<stack_id>/merged/geom_reference/hgt.rdr
mintpy.load.lookupYFile         = /mnt/data/punjab_2018_2025/<stack_id>/merged/geom_reference/lat.rdr
mintpy.load.lookupXFile         = /mnt/data/punjab_2018_2025/<stack_id>/merged/geom_reference/lon.rdr
mintpy.load.incAngleFile        = /mnt/data/punjab_2018_2025/<stack_id>/merged/geom_reference/los.rdr
mintpy.load.azAngleFile         = /mnt/data/punjab_2018_2025/<stack_id>/merged/geom_reference/los.rdr
mintpy.load.shadowMaskFile      = /mnt/data/punjab_2018_2025/<stack_id>/merged/geom_reference/shadowMask.rdr

########## 2. Reference Point
# For the first run, let MintPy choose a stable high-coherence pixel.
# After QC, replace with a manual point if needed.
mintpy.reference.lalo           = auto
mintpy.reference.yx             = auto

########## 3. Network Modification
mintpy.network.coherenceBased   = yes
mintpy.network.minCoherence     = 0.7
mintpy.network.maskDataset      = coherence
mintpy.network.tempBaseMax      = 60
mintpy.network.perpBaseMax      = 300
mintpy.network.keepMinSpanTree  = yes

########## 4. Unwrapping Error Correction
mintpy.unwrapError.method       = bridging+phase_closure
mintpy.unwrapError.waterMaskFile = auto

########## 5. Topographic Residual Correction
mintpy.topographicResidual      = yes
mintpy.topographicResidual.pixelwiseGeometry = yes
mintpy.topographicResidual.stepFuncDate      = no

########## 6. Tropospheric Delay Correction
# PyAPS/ERA5 expects pressure-level GRIB files under:
#   /mnt/data/punjab_weather/ERA5
mintpy.troposphericDelay.method        = pyaps
mintpy.troposphericDelay.weatherModel  = ERA5
mintpy.troposphericDelay.weatherDir    = /mnt/data/punjab_weather

########## 7. Deramping
# Use linear first for regional groundwater/subsidence style signals.
mintpy.deramp                   = linear
mintpy.deramp.maskFile          = maskTempCoh.h5

########## 8. Time-Series Inversion Mask
mintpy.networkInversion.maskDataset     = temporalCoherence
mintpy.networkInversion.maskThreshold   = 0.7
mintpy.networkInversion.minRedundancy   = 1.0

########## 9. Time-Series Inversion
mintpy.networkInversion.weightFunc      = variance
mintpy.networkInversion.residualNorm    = L2
mintpy.networkInversion.minNormVelocity = yes

########## 10. Velocity Estimation
mintpy.velocity.startDate       = 20180101
mintpy.velocity.endDate         = 20251231
mintpy.velocity.excludeDate     = auto
mintpy.velocity.bootstrap       = yes
mintpy.velocity.bootstrapCount  = 400

########## 11. Output Masking
mintpy.save.mask                = yes
mintpy.save.maskDataset         = temporalCoherence
mintpy.save.maskThreshold       = 0.7

########## 12. Geocoding
mintpy.geocode                  = yes
mintpy.geocode.SNWE             = auto
mintpy.geocode.latStep          = 0.0002
mintpy.geocode.lonStep          = 0.0002
mintpy.geocode.interpMethod     = nearest

########## 13. Output Products
mintpy.save.hdfEos5             = yes
mintpy.save.hdfEos5.update      = no
mintpy.save.hdfEos5.subset      = yes
mintpy.save.kmz                 = yes
mintpy.save.kmz.dpi             = 600

########## 14. Compute
mintpy.compute.maxMemory        = 16
mintpy.compute.numWorker        = 8
