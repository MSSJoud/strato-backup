# MintPy Configuration for Bologna PS Test
# =========================================
# Purpose: Time-series analysis using PS-like (Persistent Scatterer) approach
# Method: Sparse network with longer baselines, stable pixel selection
# Expected: Lower coverage but higher precision on stable scatterers (urban)

########## 1. Load Data
mintpy.load.processor      = isce
mintpy.load.autoPath       = no

# Input paths (organized by prepare_for_mintpy.sh)
mintpy.load.unwFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/interferograms/*/filt_topophase.unw.geo
mintpy.load.corFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/interferograms/*/filt_topophase.unw.geo.cor
mintpy.load.connCompFile   = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/interferograms/*/filt_topophase.unw.conncomp
mintpy.load.demFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/geometry/hgt.rdr
mintpy.load.lookupYFile    = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/geometry/lat.rdr
mintpy.load.lookupXFile    = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/geometry/lon.rdr
mintpy.load.incAngleFile   = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/geometry/los.rdr

########## 2. Network Modification (PS-specific)
mintpy.network.coherenceBased  = yes
mintpy.network.keepMinSpanTree = yes        # Keep connectivity even for sparse networks
mintpy.network.minCoherence    = 0.8        # Higher threshold for PS (more selective)
mintpy.network.maskDataset     = coherence
mintpy.network.maxTempBaseline = 180        # Match PS pair selection (days) - larger OK
mintpy.network.maxPerpBaseline = 250        # Match PS pair selection (meters) - larger OK

########## 3. Reference Point (Spatial)
# For PS: prefer stable building or bedrock (not distributed scatterers)
mintpy.reference.lalo           = auto
# Or manually specify PS location:
# mintpy.reference.lalo         = 44.494,11.343  # Bologna city center building (example)

########## 4. Reference Date (Temporal)
mintpy.reference.date           = auto      # Usually first date
# Or specify specific date:
# mintpy.reference.date         = 20230101

########## 5. Unwrapping Error Correction
mintpy.unwrapError.method          = bridging+phase_closure
mintpy.unwrapError.yx              = auto
mintpy.unwrapError.connCompMinArea = 2.5e6  # min area (m^2) for valid component

########## 6. Temporal Coherence Mask (PS selection)
# Higher threshold to focus on stable scatterers
mintpy.save.maskTempCoh           = yes
mintpy.reference.minCoherence     = 0.85    # Only keep highly coherent pixels (PS-like)

########## 7. Tropospheric Delay Correction
mintpy.troposphericDelay.method       = pyaps     # Use atmospheric model
mintpy.troposphericDelay.weatherModel = ERA5      # ERA5 reanalysis data
mintpy.troposphericDelay.weatherDir   = auto      # Auto-download

########## 8. Phase Deramping (Orbital Error Removal)
mintpy.deramp            = linear      # Remove linear ramp (range + azimuth)
mintpy.deramp.maskFile   = maskTempCoh.h5

########## 9. Topographic Residual (DEM Error) Correction
mintpy.topographicResidual            = yes
mintpy.topographicResidual.pixelwiseGeometry = yes
mintpy.topographicResidual.stepFuncDate      = auto

########## 10. Time-Series Inversion
mintpy.timeseriesInv.weightFunc       = var     # Variance-based weighting
mintpy.timeseriesInv.minNormVelocity  = no      # PS typically doesn't need min-norm
mintpy.timeseriesInv.waterMaskFile    = auto

########## 11. Velocity Estimation
mintpy.velocity.excludeDate    = auto           # Auto-exclude outliers
mintpy.velocity.startDate      = auto           # Use full time range
mintpy.velocity.endDate        = auto

########## 12. Post-Processing
# Geocoding
mintpy.geocode              = yes
mintpy.geocode.SNWE         = auto              # Auto from data bounds
mintpy.geocode.latStep      = 0.0001            # ~10m resolution
mintpy.geocode.lonStep      = 0.0001

# Save HDF-EOS5 format
mintpy.save.hdfEos5         = yes
mintpy.save.hdfEos5.update  = no
mintpy.save.hdfEos5.subset  = yes

########## 13. Compute and Processing Settings
mintpy.compute.maxMemory    = 4                 # GB
mintpy.compute.numWorker    = 4                 # Parallel workers (auto=all cores)

########## 14. Plotting
mintpy.plot                 = yes
mintpy.plot.maxMemory       = 2.0               # GB for plotting

########## Method-Specific Notes:
# PS-like approach emphasizes:
# - Higher coherence thresholds (select stable scatterers)
# - Sparse network with longer baselines acceptable
# - Point targets (buildings, rocks, infrastructure)
# - Best for urban areas and stable reflectors
# - Expected output: Lower pixel density, ~2-5 mm/year precision on PSs
#
# Key differences from SBAS:
# 1. minCoherence: 0.8 vs 0.7 (more selective)
# 2. maxTempBaseline: 180 vs 48 days (larger acceptable)
# 3. maxPerpBaseline: 250 vs 100 m (larger acceptable)
# 4. minNormVelocity: no vs yes (PS doesn't need rank-deficiency handling)
# 5. reference.minCoherence: 0.85 (stricter masking)
