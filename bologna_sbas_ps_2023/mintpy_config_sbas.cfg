##------------------------ MintPy Configuration File for Bologna SBAS ------------------------##
## 
## Bologna SBAS Test Case - 2023 Time Series with Atmospheric Corrections
## 
## Processing workflow:
##   1. Load ISCE2 interferogram stack
##   2. Apply ERA5 tropospheric correction  
##   3. Reference network selection
##   4. Phase unwrapping error correction
##   5. Topographic residual correction
##   6. Tropospheric delay correction using ERA5
##   7. Deramping (if needed)
##   8. Time-series inversion (SBAS method)
##   9. Velocity estimation
##   10. Geocoding
##
## Usage:
##   smallbaselineApp.py --dir work_sbas --template mintpy_config_sbas.cfg
##
##--------------------------------------------------------------------------------------##

########## 1. Load Data
mintpy.load.processor           = isce
mintpy.load.autoPath            = yes

## Path to ISCE2 stack directory  (adjust to your output directory)
mintpy.load.metaFile            = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/reference/IW*.xml
mintpy.load.baselineDir         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/baselines

## Interferogram files
mintpy.load.unwFile             = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/interferograms/*/filt_*.unw
mintpy.load.corFile             = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/interferograms/*/filt_*.cor

## Geometry files  
mintpy.load.demFile             = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/geom_reference/hgt.rdr
mintpy.load.lookupYFile         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/geom_reference/lat.rdr
mintpy.load.lookupXFile         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/geom_reference/lon.rdr
mintpy.load.incAngleFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/geom_reference/los.rdr
mintpy.load.azAngleFile         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/geom_reference/los.rdr
mintpy.load.shadowMaskFile      = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/sbas/merged/geom_reference/shadowMask.rdr


########## 2. Subset (Optional - for faster processing or specific AOI)
## Uncomment to process only a subset
# mintpy.subset.lalo              = 44.3:44.7,11.1:11.6    # Bologna city center
# mintpy.subset.yx                = 200:800,300:900         # Or use row/column coordinates


########## 3. Reference Point
## MintPy will auto-select a high-coherence pixel, or specify manually
mintpy.reference.lalo           = auto    # or specify: 44.5,11.35
mintpy.reference.yx             = auto    # or specify row/column


########## 4. Network Modification
## Exclude interferograms with poor quality
mintpy.network.coherenceBased   = yes
mintpy.network.minCoherence     = 0.7     # Exclude ifgrams with mean coherence < 0.7
mintpy.network.maskDataset      = coherence

## Temporal baseline threshold (SBAS uses shorter baselines)
mintpy.network.tempBaseMax      = 60      # days (slightly higher than pair selection for redundancy)
mintpy.network.perpBaseMax      = 300     # meters (ISCE2 calculated actual Bperp)

## MST: Minimum Spanning Tree for network optimization
mintpy.network.keepMinSpanTree  = yes


########## 5. Phase Unwrapping Error Correction
mintpy.unwrapError.method       = bridging+phase_closure    # Recommended for SBAS
mintpy.unwrapError.waterMaskFile = auto                     # Auto-detect water bodies


########## 6. Topographic Residual Correction
## Correct for DEM errors (strongly correlated with perpendicular baseline)
mintpy.topographicResidual      = yes
mintpy.topographicResidual.pixelwiseGeometry = yes
mintpy.topographicResidual.stepFuncDate      = no


########## 7. Tropospheric Delay Correction (CRITICAL FOR BOLOGNA)
## Use ERA5 weather model for atmospheric correction
mintpy.troposphericDelay.method        = weatherModel
mintpy.weatherModel.name               = ERA5

## Path to downloaded ERA5 files (from download_era5_bologna_2023.py)
mintpy.weatherModel.dir                = /mnt/data/sbas_vs_ps_test_bologna/era5

## ERA5 file pattern (matches our download script output)
mintpy.weatherModel.source             = era5_bologna_*.nc

## Reference height for tropospheric delay (auto = use reference pixel height)
mintpy.weatherModel.heightRef          = auto


########## 8. Deramping (Remove Long-Wavelength Orbital/Atmospheric Signals)
## Linear ramp removal
mintpy.deramp                   = linear    # or 'quadratic' for more aggressive deramping
mintpy.deramp.maskFile          = maskTempCoh.h5


########## 9. Temporal Coherence Threshold
## Mask pixels with low temporal coherence
mintpy.networkInversion.maskDataset     = temporalCoherence
mintpy.networkInversion.maskThreshold   = 0.7
mintpy.networkInversion.minRedundancy   = 1.0


########## 10. Time-Series Inversion
## SBAS inversion method
mintpy.networkInversion.weightFunc      = variance    # Weight by coherence
mintpy.networkInversion.residualNorm    = L2          # L2 norm for SBAS


########## 11. Velocity Estimation
## Linear velocity from time series
mintpy.velocity.excludeDate     = auto    # Auto-exclude outlier dates
mintpy.velocity.bootstrap       = yes     # Bootstrap for uncertainty estimation
mintpy.velocity.bootstrapCount  = 400     # Number of bootstrap samples


########## 12. Quality Metrics
## Temporal coherence threshold for final output
mintpy.save.mask               = yes
mintpy.save.maskDataset        = temporalCoherence
mintpy.save.maskThreshold      = 0.7


########## 13. Geocoding
## Convert to geographic coordinates (WGS84)
mintpy.geocode                 = yes
mintpy.geocode.SNWE            = auto    # Use full extent, or specify: S,N,W,E
mintpy.geocode.latStep         = 0.0002  # ~20m at Bologna latitude
mintpy.geocode.lonStep         = 0.0002
mintpy.geocode.interpMethod    = nearest


########## 14. Output
## Products to save
mintpy.save.hdfEos5            = yes     # For GIS compatibility
mintpy.save.hdfEos5.update     = no
mintpy.save.hdfEos5.subset     = yes
mintpy.save.kmz                = yes     # Google Earth overlay
mintpy.save.kmz.dpi            = 600


########## 15. Computation
## Parallel processing settings (adjust based on your system)
mintpy.compute.maxMemory       = 16      # GB
mintpy.compute.numWorker       = 8       # CPU cores


##--------------------------------------------------------------------------------------##
## Expected Output Files:
##
## - timeseries.h5                  Raw time-series (reference point = 0)
## - timeseries_ERA5_ramp_demErr.h5 Corrected time-series (troposphere + DEM + ramp)
## - velocity.h5                    Linear velocity (mm/year)
## - temporalCoherence.h5           Quality metric
## - maskTempCoh.h5                 Mask based on temporal coherence
## - geo_timeseries.h5              Geocoded time-series
## - geo_velocity.h5                Geocoded velocity
## - geo_temporalCoherence.h5       Geocoded temporal coherence
##
## Processing Time Estimate: 2-4 hours (depends on number of interferograms and CPU)
##--------------------------------------------------------------------------------------##
