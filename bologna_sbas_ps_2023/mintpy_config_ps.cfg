##------------------------ MintPy Configuration File for Bologna PS ------------------------##
## 
## Bologna PS (Persistent Scatterer) Test Case - 2023 Time Series with Atmospheric Corrections
## 
## PS method uses longer temporal baselines and more interferograms than SBAS
## Better for urban areas with stable reflectors (buildings, infrastructure)
##
## Processing workflow (same as SBAS but with different network parameters):
##   1. Load ISCE2 interferogram stack (345 pairs)
##   2. Apply ERA5 tropospheric correction  
##   3. Reference network selection (denser network than SBAS)
##   4. Phase unwrapping error correction
##   5. Topographic residual correction
##   6. Tropospheric delay correction using ERA5
##   7. Deramping
##   8. Time-series inversion (PS method tolerates more noise)
##   9. Velocity estimation
##   10. Geocoding
##
## Usage:
##   smallbaselineApp.py --dir work_ps --template mintpy_config_ps.cfg
##
##--------------------------------------------------------------------------------------##

########## 1. Load Data
mintpy.load.processor           = isce
mintpy.load.autoPath            = yes

## Path to ISCE2 stack directory (adjust to your output directory)
mintpy.load.metaFile            = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/reference/IW*.xml
mintpy.load.baselineDir         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/baselines

## Interferogram files (345 PS pairs)
mintpy.load.unwFile             = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/interferograms/*/filt_*.unw
mintpy.load.corFile             = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/interferograms/*/filt_*.cor

## Geometry files  
mintpy.load.demFile             = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/geom_reference/hgt.rdr
mintpy.load.lookupYFile         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/geom_reference/lat.rdr
mintpy.load.lookupXFile         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/geom_reference/lon.rdr
mintpy.load.incAngleFile        = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/geom_reference/los.rdr
mintpy.load.azAngleFile         = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/geom_reference/los.rdr
mintpy.load.shadowMaskFile      = /mnt/data/sbas_vs_ps_test_bologna/mintpy_input/ps/merged/geom_reference/shadowMask.rdr


########## 2. Subset (Optional)
## Uncomment to focus on Bologna urban area
# mintpy.subset.lalo              = 44.3:44.7,11.1:11.6
# mintpy.subset.yx                = 200:800,300:900


########## 3. Reference Point
## For PS, choose a stable urban point (building, monument)
mintpy.reference.lalo           = auto    # MintPy will find high-coherence pixel
mintpy.reference.yx             = auto


########## 4. Network Modification (PS-SPECIFIC SETTINGS)
## PS uses denser network with longer temporal baselines
mintpy.network.coherenceBased   = yes
mintpy.network.minCoherence     = 0.6     # Lower than SBAS (PS tolerates more noise)
mintpy.network.maskDataset      = coherence

## Temporal baseline - PS allows much longer baselines
mintpy.network.tempBaseMax      = 200     # days (vs 60 for SBAS)
mintpy.network.perpBaseMax      = 300     # meters

## MST for network connectivity
mintpy.network.keepMinSpanTree  = yes

## Connection number - PS typically has more connections per date
mintpy.network.minCoherence     = 0.6
mintpy.network.aoiYX            = auto
mintpy.network.aoiLALO          = auto


########## 5. Phase Unwrapping Error Correction
## PS method: More aggressive bridging due to denser network
mintpy.unwrapError.method       = bridging    # Simplified for PS
mintpy.unwrapError.waterMaskFile = auto
mintpy.unwrapError.ramp         = quadratic   # Quadratic for longer baselines


########## 6. Topographic Residual Correction
## Same as SBAS
mintpy.topographicResidual      = yes
mintpy.topographicResidual.pixelwiseGeometry = yes
mintpy.topographicResidual.stepFuncDate      = no


########## 7. Tropospheric Delay Correction (CRITICAL FOR BOLOGNA)
## Use ERA5 weather model - same as SBAS
mintpy.troposphericDelay.method        = weatherModel
mintpy.weatherModel.name               = ERA5

## Path to ERA5 files (same directory as SBAS)
mintpy.weatherModel.dir                = /mnt/data/sbas_vs_ps_test_bologna/era5
mintpy.weatherModel.source             = era5_bologna_*.nc
mintpy.weatherModel.heightRef          = auto


########## 8. Deramping
## More aggressive for PS (longer baselines = more orbital errors)
mintpy.deramp                   = quadratic    # vs 'linear' for SBAS
mintpy.deramp.maskFile          = maskTempCoh.h5


########## 9. Temporal Coherence Threshold
## PS: Lower threshold (accepts more pixels, relies on PS stability)
mintpy.networkInversion.maskDataset     = temporalCoherence
mintpy.networkInversion.maskThreshold   = 0.5     # vs 0.7 for SBAS
mintpy.networkInversion.minRedundancy   = 1.0


########## 10. Time-Series Inversion (PS-SPECIFIC)
## PS inversion parameters
mintpy.networkInversion.weightFunc      = variance
mintpy.networkInversion.residualNorm    = L1          # L1 norm - more robust for PS
mintpy.networkInversion.minNormVelocity = yes         # Minimize velocity for stability


########## 11. Velocity Estimation
## Same as SBAS
mintpy.velocity.excludeDate     = auto
mintpy.velocity.bootstrap       = yes
mintpy.velocity.bootstrapCount  = 400


########## 12. Quality Metrics
## PS: Lower threshold to retain more PS points
mintpy.save.mask               = yes
mintpy.save.maskDataset        = temporalCoherence
mintpy.save.maskThreshold      = 0.5      # vs 0.7 for SBAS


########## 13. Geocoding
## Same as SBAS
mintpy.geocode                 = yes
mintpy.geocode.SNWE            = auto
mintpy.geocode.latStep         = 0.0002   # ~20m
mintpy.geocode.lonStep         = 0.0002
mintpy.geocode.interpMethod    = nearest


########## 14. Output
## Same as SBAS
mintpy.save.hdfEos5            = yes
mintpy.save.hdfEos5.update     = no
mintpy.save.hdfEos5.subset     = yes
mintpy.save.kmz                = yes
mintpy.save.kmz.dpi            = 600


########## 15. Computation
## PS has more interferograms → needs more memory/CPU
mintpy.compute.maxMemory       = 24      # GB (higher than SBAS)
mintpy.compute.numWorker       = 8       # CPU cores


##--------------------------------------------------------------------------------------##
## Key Differences from SBAS:
##
## 1. Network Parameters:
##    - More interferograms (345 vs 114)
##    - Longer temporal baselines (≤180 days vs ≤48 days)
##    - Lower coherence threshold (0.6 vs 0.7)
##
## 2. Inversion:
##    - L1 norm (more robust to outliers)
##    - Quadratic deramping (for longer baselines)
##    - Lower temporal coherence threshold (0.5 vs 0.7)
##
## 3. Expected Performance:
##    - Better in urban areas (persistent scatterers)
##    - More spatial coverage (lower coherence threshold)
##    - Potentially noisier in vegetated areas
##    - Longer processing time (~6-8 hours vs 2-4 for SBAS)
##
##--------------------------------------------------------------------------------------##
## Expected Output Files (same as SBAS):
##
## - timeseries.h5
## - timeseries_ERA5_ramp_demErr.h5  (with tropospheric correction)
## - velocity.h5
## - temporalCoherence.h5
## - maskTempCoh.h5
## - geo_*.h5 (geocoded products)
##
##--------------------------------------------------------------------------------------##
